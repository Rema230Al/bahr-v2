# Deploy:  fly deploy
# Secrets (never in this file):  fly secrets set DATABASE_URL=… SESSION_SECRET=… ADMIN_EMAIL=… ADMIN_PASSWORD=… PROXY_SECRET=… ALLOWED_ORIGIN=…
app = "bahr-api"
primary_region = "fra"  # Frankfurt: closest to Jeddah among Fly regions, and next to Neon's eu-central-1

[build]

[env]
  PORT = "3000"
  CLIENT_IP_HEADER = "fly-client-ip"
  COOKIE_SECURE = "true"
  DATABASE_POOL_MAX = "5"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle, so it costs almost nothing
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
